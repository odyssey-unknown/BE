name: CI

# main 에 push 하거나 main 으로 PR 을 올릴 때 실행
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # build.gradle 의 toolchain 과 같은 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # 의존성을 캐시해서 매 실행마다 다시 받지 않는다
          cache: gradle

      # Windows 에서 만든 저장소라 실행 권한이 없을 수 있다
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Testcontainers 가 postgres 를 띄운다 (ubuntu 러너에 Docker 가 있음)
      - name: Build & Test
        run: ./gradlew build

      # 실패했을 때 원인을 보기 위한 리포트
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
